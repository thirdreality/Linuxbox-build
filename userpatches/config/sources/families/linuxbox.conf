# ThirdReality HubV3 family (Amlogic A113X / meson-axg).
#
# Everything here lives in userpatches and is layered on top of an unmodified
# upstream Armbian checkout.  Only stable Armbian interfaces are used:
# meson64_common.inc, the family/board variables, the legacy family_tweaks_bsp
# hook and the extension hook names listed in extensions/linuxbox-*.sh.

source "${SRC}/config/sources/families/include/meson64_common.inc"

# Kernel and u-boot are pinned and do not follow the Armbian release.
# Upstream dropped patch/kernel/archive/meson64-6.6 in v25.5, so the full 6.6
# patch set is carried in userpatches/kernel/linuxbox-6.6.
declare -g KERNEL_MAJOR_MINOR="6.6"
declare -g KERNELBRANCH="tag:v6.6.158"
declare -g KERNELPATCHDIR="linuxbox-6.6"
declare -g LINUXCONFIG="linux-linuxbox-${BRANCH}"

BOOTBRANCH="tag:v2023.10"
BOOTPATCHDIR="linuxbox-v2023.10"
UBOOT_TARGET_MAP="u-boot-dtb.img;;u-boot.bin.sd.bin:u-boot.bin u-boot.bin:u-boot.nosd.bin u-boot-dtb.img"
BOOTSCRIPT="boot-linuxbox.cmd:boot.cmd"

CPUMIN=250000
CPUMAX=1416000
GOVERNOR="ondemand"
CPUFREQUTILS_ENABLE=true
OFFSET=126

# Separate /boot partition, mounted read-only at runtime (see linuxbox-hubv3
# extension); size must match 'boot' in amlogic-boot-tools partition_arm.dtsi.
BOOTFS_TYPE="ext4"
BOOTSIZE="128"

# FIP blobs (fip/) and the USB burn image converter (burn/).
declare -g LINUXBOX_BOOT_TOOLS_URL="${LINUXBOX_BOOT_TOOLS_URL:-https://github.com/thirdreality/amlogic-boot-tools}"
declare -g LINUXBOX_BOOT_TOOLS_REF="${LINUXBOX_BOOT_TOOLS_REF:-branch:hubv3}"

function fetch_sources_tools__thirdreality_amlogic_boot_tools() {
	fetch_from_repo "${LINUXBOX_BOOT_TOOLS_URL}" "amlogic-boot-tools" "${LINUXBOX_BOOT_TOOLS_REF}"
}

uboot_custom_postprocess() {
	uboot_axg_postprocess_ng "${SRC}/cache/sources/amlogic-boot-tools/fip/${LINUXBOX_FIP_DIR:?}"
}

write_uboot_platform() {
	local method=0 mmcblk_prefix mmc_boot

	if [[ "$2" == *mmcblk* ]]; then
		mmcblk_prefix=$(echo "$2" | grep -Po "mmcblk\d")
		[[ -z "$mmcblk_prefix" ]] && return 1
		mmc_boot=${mmcblk_prefix}boot
		[[ -e /dev/${mmc_boot}0 ]] && method=1
	fi

	dd if="$1/u-boot.bin" of="$2" bs=1 count=442 conv=fsync > /dev/null 2>&1
	dd if="$1/u-boot.bin" of="$2" bs=512 skip=1 seek=1 conv=fsync > /dev/null 2>&1

	if [[ $method == 1 ]]; then
		echo 0 > "/sys/block/${mmc_boot}0/force_ro"
		echo 0 > "/sys/block/${mmc_boot}1/force_ro"
		dd if="$1/u-boot.bin" of="/dev/${mmc_boot}0" bs=512 skip=1 conv=fsync > /dev/null 2>&1
		dd if="$1/u-boot.bin" of="/dev/${mmc_boot}1" bs=512 skip=1 conv=fsync > /dev/null 2>&1
	fi
}

# meson64_common's family_tweaks_bsp only writes X11 configs for HDMI boards.
family_tweaks_bsp() {
	:
}

enable_extension "linuxbox-hubv3"
enable_extension "linuxbox-w1"
enable_extension "linuxbox-bl706"
enable_extension "linuxbox-burn"
