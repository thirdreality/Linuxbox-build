# ThirdReality HubV3: Amlogic A113X quad core, 2GB RAM, eMMC, W155S1 WiFi/BT, BL706 Zigbee/Thread
BOARD_NAME="LinuxBox-HubV3"
BOARDFAMILY="linuxbox"
BOARD_MAINTAINER="liuguoping1024"
BOOTCONFIG="linuxbox-v3_defconfig"
KERNEL_TARGET="current"
KERNEL_TEST_TARGET="current"
DEFAULT_CONSOLE="serial"
HAS_VIDEO_OUTPUT="no"
HOST="linuxbox-hubv3"

# FIP set under amlogic-boot-tools/fip/, and the variant passed to burn/convert.sh
LINUXBOX_FIP_DIR="hubv3"
LINUXBOX_BURN_VARIANT="v3"

# W1 bring-up scripts use ifconfig/hciconfig; BL706 flasher needs pip/python3-dev
PACKAGE_LIST_BOARD="bluez net-tools python3-pip python3-dev"
PACKAGE_LIST_BOARD_REMOVE="unattended-upgrades"
