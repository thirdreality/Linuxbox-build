# Upstream Armbian checkout used by build.sh.
ARMBIAN_GIT_URL="https://github.com/armbian/build"
ARMBIAN_DEFAULT_TAG="v24.11.1"

# Releases each Armbian tag/branch marks as 'supported' (config/distributions/*/support).
# vYY.MM entries are upstream release branches (moving; HEAD at clone time).
# main is 26.11 trunk until v26.11.x is tagged.
declare -A ARMBIAN_RELEASES=(
	[v24.11.1]="bookworm jammy noble"
	[v25.2.1]="bookworm jammy noble"
	[v25.5.1]="bookworm noble"
	[v25.8.2]="bookworm noble trixie"
	[v25.11.1]="noble trixie"
	[v26.2.1]="noble trixie"
	[v26.5.1]="noble resolute trixie"
	[v26.08]="noble resolute trixie"
	[main]="noble resolute trixie"
)
